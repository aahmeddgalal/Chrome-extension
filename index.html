<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chrome extension</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-width: 400px ;
        }
        #inputField {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #007BFF;
            border-radius: 4px;
        }
        #sendButton,
        #clearButton {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: 1px solid #007BFF;
            cursor: pointer;
        }
        #sendButton:hover,
        #clearButton:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        #inputField:focus,
        #sendButton:focus,
        #clearButton:focus {
            border-color: #0056b3;
            outline: 1px solid #0056b3;
            border-radius: 4px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            color: #0056b3;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <input type="text" id="inputField" placeholder="Enter some text">
    <button id="sendButton">SAVE INPUT</button>
    <button id="clearButton">CLEAR</button>
    <ul id="output"></ul>


    <script src="script.js"></script>
</body>
</html>
